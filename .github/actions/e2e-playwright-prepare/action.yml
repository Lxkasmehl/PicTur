name: E2E Playwright prepare
description: Docker Compose stack, health waits, auth seed, npm ci, Playwright browsers
runs:
  using: composite
  steps:
    - name: Create .env for Docker Compose
      shell: bash
      run: |
        echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
        echo "SESSION_SECRET=$(openssl rand -hex 32)" >> .env
        echo "FRONTEND_URL=http://localhost" >> .env

    - name: Build and start services with Docker Compose
      shell: bash
      run: docker compose up -d --build

    - name: Wait for auth backend
      shell: bash
      run: |
        n=0
        until [ $n -ge 60 ]; do
          if curl -sf http://localhost:3001/api/health > /dev/null; then break; fi
          n=$((n+1)); sleep 1
        done
        [ $n -lt 60 ] || (echo "Auth backend did not become ready"; exit 1)

    - name: Wait for Flask backend
      shell: bash
      run: |
        n=0
        until [ $n -ge 120 ]; do
          if curl -sf http://localhost:5000/api/health > /dev/null; then break; fi
          n=$((n+1)); sleep 1
        done
        [ $n -lt 120 ] || (echo "Flask backend did not become ready"; exit 1)

    - name: Wait for frontend
      shell: bash
      run: |
        n=0
        until [ $n -ge 30 ]; do
          if curl -sf http://localhost:80 > /dev/null; then break; fi
          n=$((n+1)); sleep 1
        done
        [ $n -lt 30 ] || (echo "Frontend did not become ready"; exit 1)

    - name: Seed test users in auth backend
      shell: bash
      run: |
        docker compose exec -T -e E2E_ADMIN_EMAIL=admin@test.com \
          -e E2E_ADMIN_PASSWORD=testpassword123 \
          -e E2E_STAFF_EMAIL=staff@test.com \
          -e E2E_STAFF_PASSWORD=testpassword123 \
          -e E2E_COMMUNITY_EMAIL=community@test.com \
          -e E2E_COMMUNITY_PASSWORD=testpassword123 \
          -e E2E_ROLE_TEST_EMAIL=role-test-community@test.com \
          -e E2E_ROLE_TEST_PASSWORD=testpassword123 \
          auth-backend node dist/scripts/seed-test-users.js

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    # Cache the downloaded browser binaries, keyed on the resolved Playwright version.
    # The browser download (not the apt deps) is what stalled on the CDN and silently burned
    # the entire job budget; a cache hit skips the download entirely, and a miss is guarded below.
    - name: Resolve Playwright version
      id: pw
      shell: bash
      working-directory: frontend
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

    # System libraries are apt packages (not covered by the browser cache), so always install
    # them. Guarded with a timeout + one retry so a stalled apt mirror fails fast.
    - name: Install Playwright system dependencies
      shell: bash
      working-directory: frontend
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        set +e
        for i in 1 2; do
          timeout -k 30 300 npx playwright install-deps
          status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          echo "playwright install-deps attempt $i failed (status $status); retrying in 15s..."
          sleep 15
        done
        echo "playwright install-deps failed after retries"
        exit 1

    # Browser binaries: download only on a cache miss, and guard the download with a timeout +
    # retries so a CDN stall fails fast instead of hanging until the job timeout.
    - name: Install Playwright browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: |
        set +e
        for i in 1 2 3; do
          timeout -k 30 300 npx playwright install
          status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          echo "playwright browser install attempt $i failed (status $status); retrying in 15s..."
          sleep 15
        done
        echo "playwright browser install failed after retries"
        exit 1
